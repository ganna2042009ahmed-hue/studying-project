<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Customizer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <h1>Website Customizer</h1>

        <p>Change the appearance of any website</p>

        <button id="background">Change Background</button>

        <button id="color">Change Text Color</button>

        <button id="size">Increase Text Size</button>

        <button id="reset">Reset Website</button>

        <p id="message"></p>

    </div>

    <script src="script.js"></script>

</body>
</html>
